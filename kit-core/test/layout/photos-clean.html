<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Clean photos</title>
<style>body{margin:0;font:16px/1.5 Arial,sans-serif;color:#141517;background:#faf8f4}main{padding:40px}
.grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,300px);gap:24px}
.card{background:#fff}.card img{display:block;width:300px;height:200px;object-fit:cover;background:#ddd}.card h2{margin:12px;font-size:20px}
.icon{width:24px;height:24px}</style>
<!-- The control: every card has its own photo; one image comes back twice but never side by
     side; a small icon repeats in every card. -->
<main>
<h1>Listings</h1>
<ul class="grid">
  <li class="card"><img src="/img/a.png" alt="Flat" width="300" height="200"><h2><img class="icon" src="/img/pin.png" alt="">Flat</h2></li>
  <li class="card"><img src="/img/b.png" alt="House" width="300" height="200"><h2><img class="icon" src="/img/pin.png" alt="">House</h2></li>
  <li class="card"><img src="/img/c.png" alt="Loft" width="300" height="200"><h2><img class="icon" src="/img/pin.png" alt="">Loft</h2></li>
  <li class="card"><img src="/img/d.png" alt="Studio" width="300" height="200"><h2><img class="icon" src="/img/pin.png" alt="">Studio</h2></li>
  <li class="card"><img src="/img/a.png?w=400" alt="Flat, other view" width="300" height="200"><h2><img class="icon" src="/img/pin.png" alt="">Flat</h2></li>
  <li class="card"><img src="/img/e.png" alt="Villa" width="300" height="200"><h2><img class="icon" src="/img/pin.png" alt="">Villa</h2></li>
</ul>
</main>
