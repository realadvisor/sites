<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Motifs on flat grounds</title>
<style>body{margin:0;font:16px/1.5 Arial,sans-serif;color:#141517;background:#faf8f4}
header{display:flex;align-items:center;gap:16px;padding:12px 40px}
.hero{position:relative;height:560px}.hero img{display:block;width:100%;height:100%;object-fit:cover}
.panel{position:absolute;left:40px;bottom:40px;width:420px;padding:32px;background:#102e4e;color:#fff}
.panel svg{display:block;width:100%;height:12px}
.arrow{position:absolute;right:24px;top:24px;width:40px;height:40px}
.divider{display:block;width:100%;height:64px}</style>
<!-- The control: a logo SVG, a ridge drawn inside an opaque panel that sits on the photo, a
     40px arrow icon over the photo and a full-width divider on the paper ground. -->
<header><a href="/" aria-label="Home"><svg class="logo" aria-hidden="true" width="160" height="40" viewBox="0 0 160 40"><rect width="160" height="40" fill="#102e4e"/></svg></a></header>
<main>
<section class="hero"><img src="/img/hero.png" alt="Houses by the lake" width="1600" height="900">
  <svg class="arrow" aria-hidden="true" viewBox="0 0 10 10"><path d="M2 5h6M5 2l3 3-3 3" stroke="#fff" fill="none"/></svg>
  <div class="panel"><h1 style="margin:0 0 12px">Homes by the lake</h1><svg aria-hidden="true" viewBox="0 0 100 10" preserveAspectRatio="none"><path d="M0 8 L30 2 L60 6 L100 1" fill="none" stroke="#e5c89e"/></svg></div></section>
<svg class="divider" aria-hidden="true" viewBox="0 0 100 10" preserveAspectRatio="none"><path d="M0 8 L20 3 L40 6 L60 1 L80 5 L100 2" fill="none" stroke="#102e4e" stroke-width=".3"/></svg>
<p>Our team values homes across the region.</p>
</main>
