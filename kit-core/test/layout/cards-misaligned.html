<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Misaligned cards</title>
<style>body{margin:0;font:16px/1.5 Arial,sans-serif;color:#141517;background:#faf8f4}main{padding:40px}
.grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,260px);gap:24px}
.card{background:#fff;padding:16px}.eyebrow{margin:0;font-size:14px;color:#555}.title{margin:4px 0 12px;font-size:22px}
.facts{margin:0;padding-top:8px;border-top:1px solid #ccc}.price{margin:8px 0 0;font-weight:700}</style>
<!-- Three cards in one row; the middle card's long place name wraps to a second line, so its
     title, divider, facts and price sit one line lower than its neighbours'. -->
<main>
<h1>Listings</h1>
<ul class="grid">
  <li class="card"><p class="eyebrow">Flat · Lausanne</p><h2 class="title">Bright flat</h2><p class="facts">3.5 rooms · 92 m²</p><p class="price">CHF 890’000</p></li>
  <li class="card"><p class="eyebrow">House · Saint-Légier-La Chiésaz sur Vevey</p><h2 class="title">Family house</h2><p class="facts">6.5 rooms · 180 m²</p><p class="price">CHF 1’450’000</p></li>
  <li class="card"><p class="eyebrow">Loft · Morges</p><h2 class="title">Loft by the lake</h2><p class="facts">2.5 rooms · 75 m²</p><p class="price">CHF 720’000</p></li>
</ul>
</main>
